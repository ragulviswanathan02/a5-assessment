<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>

  <!-- Left Emblem: MSME Tri-color Gear -->
  <g transform="translate(48, 60)">
    <!-- Outer Gear Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1565c0" stroke-width="4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    
    <!-- Tricolor Bands -->
    <path d="M -28 -14 A 31 31 0 0 1 28 -14" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#0d47a1" stroke-width="5" stroke-linecap="round"/>
    <path d="M -28 14 A 31 31 0 0 0 28 14" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Chakra Gear -->
    <circle cx="0" cy="0" r="12" fill="#0d47a1"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Right Text Block -->
  <g transform="translate(105, 0)">
    <!-- Hindi Subtitle -->
    <text x="0" y="32" fill="#424242" font-size="11" font-weight="700">सूक्ष्म, लघु एवं मध्यम उद्यम</text>
    
    <!-- Bold MSME Title -->
    <text x="0" y="68" fill="#0d47a1" font-size="36" font-weight="900" letter-spacing="2">MSME</text>
    
    <!-- English Subtitle & Govt text -->
    <text x="0" y="86" fill="#616161" font-size="9" font-weight="800" letter-spacing="0.8">MICRO, SMALL &amp; MEDIUM ENTERPRISES</text>
    <text x="0" y="102" fill="#e65100" font-size="10" font-weight="800" letter-spacing="1">GOVERNMENT OF INDIA</text>
  </g>
</svg>